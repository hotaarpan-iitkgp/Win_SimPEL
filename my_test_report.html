<title>Circuit Simulation & Verification Report</title>
<style>
  :root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --card-border: #e2e8f0;
    --text-main: #0f172a;
    --text-sub: #64748b;
    --accent: #0284c7;
    --code-bg: #f1f5f9;
    --code-text: #0f172a;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  .header {
    margin-bottom: 24px;
    border-bottom: 2px solid var(--card-border);
    padding-bottom: 16px;
  }
  .header h1 {
    margin: 0 0 8px 0;
    color: var(--accent);
    font-size: 28px;
  }
  .meta-bar {
    display: flex;
    gap: 16px;
    font-size: 14px;
    color: var(--text-sub);
  }
  .meta-item {
    background: #e0f2fe;
    color: #0369a1;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #0284c733;
    font-weight: 500;
  }
  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
  }
  .card-title {
    font-size: 20px;
    font-weight: 600;
    margin-top: 0;
    margin-bottom: 16px;
    color: var(--text-main);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .svg-wrapper {
    background: #ffffff;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px;
    overflow: hidden;
    text-align: center;
    max-width: 100%;
  }
  .svg-wrapper svg {
    max-width: 100%;
    height: auto;
  }
  details summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 18px;
    color: var(--accent);
    padding: 8px 0;
    user-select: none;
  }
  details[open] summary {
    border-bottom: 1px solid var(--card-border);
    margin-bottom: 12px;
  }
  pre {
    background-color: var(--code-bg);
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    font-family: 'Fira Code', Consolas, Monaco, monospace;
    font-size: 13px;
    color: var(--code-text);
    max-height: 400px;
  }
  .copy-btn {
    background: #0284c7;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
    float: right;
  }
  .copy-btn:hover { background: #0369a1; }
</style>
</head>
